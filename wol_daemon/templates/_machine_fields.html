{# Shared machine fields for adding and editing. Expects `form` (see _machine_form_values). #}
<div class="form-grid">
  <div>
    <label class="field-label">Name</label>
    <input type="text" name="name" value="{{ form.name }}" placeholder="Desktop PC">
  </div>
  <div>
    <label class="field-label">MAC address</label>
    <input type="text" name="mac_address" value="{{ form.mac_address }}" placeholder="AA:BB:CC:DD:EE:FF" required>
  </div>
  <div>
    <label class="field-label">IP address</label>
    <input type="text" name="ip_address" value="{{ form.ip_address }}" placeholder="192.168.1.20" required>
  </div>
</div>

<label class="field-label">Shutdown method</label>
<div class="shutdown-picker">
  <input type="radio" id="type-none" name="shutdown_type" value="none" {{ 'checked' if form.shutdown_type == 'none' else '' }}>
  <label for="type-none">Wake only</label>
  <input type="radio" id="type-proxmox" name="shutdown_type" value="proxmox" {{ 'checked' if form.shutdown_type == 'proxmox' else '' }}>
  <label for="type-proxmox">Proxmox node</label>
  <input type="radio" id="type-ssh" name="shutdown_type" value="ssh" {{ 'checked' if form.shutdown_type == 'ssh' else '' }}>
  <label for="type-ssh">SSH (plain PC)</label>

  <div class="shutdown-fields proxmox-fields">
    <div class="form-grid">
      <div>
        <label class="field-label">Proxmox host (API URL)</label>
        <input type="text" name="proxmox_host" value="{{ form.proxmox_host }}" placeholder="https://192.168.1.10:8006">
      </div>
      <div>
        <label class="field-label">Node name</label>
        <input type="text" name="proxmox_node" value="{{ form.proxmox_node }}" placeholder="pve">
      </div>
      <div>
        <label class="field-label">Token ID</label>
        <input type="text" name="proxmox_token_id" value="{{ form.proxmox_token_id }}" placeholder="wol-daemon@pve!wol-daemon">
      </div>
      <div>
        <label class="field-label">Token secret</label>
        <input type="password" name="proxmox_token_secret" autocomplete="off"
               placeholder="{{ 'unchanged – leave empty to keep' if form.has_secret else 'xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx' }}">
      </div>
    </div>
    <label class="checkbox-row"><input type="checkbox" name="proxmox_verify_ssl" {{ 'checked' if form.proxmox_verify_ssl else '' }}>Verify TLS certificate (leave unchecked for a self-signed cert)</label>
  </div>

  <div class="shutdown-fields ssh-fields">
    <div class="form-grid">
      <div>
        <label class="field-label">SSH host</label>
        <input type="text" name="ssh_host" value="{{ form.ssh_host }}" placeholder="defaults to IP address above">
      </div>
      <div>
        <label class="field-label">SSH port</label>
        <input type="number" name="ssh_port" value="{{ form.ssh_port }}" placeholder="22">
      </div>
      <div>
        <label class="field-label">Username</label>
        <input type="text" name="ssh_username" value="{{ form.ssh_username }}" placeholder="root">
      </div>
      <div>
        <label class="field-label">Private key path</label>
        <input type="text" name="ssh_private_key_path" value="{{ form.ssh_private_key_path }}" placeholder="/config/ssh/desktop_key">
      </div>
    </div>
    <div>
      <label class="field-label">Shutdown command</label>
      <input type="text" name="ssh_command" value="{{ form.ssh_command }}" placeholder="shutdown -h +1" style="width: 100%;">
    </div>
  </div>
</div>
