<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}WOL Daemon{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="topnav">
    <a class="topnav-brand" href="{{ url_for('index') }}">WOL Daemon</a>
    {% if logged_in %}
    <div class="topnav-links">
      <a href="{{ url_for('machine_add') }}">Add machine</a>
      <a href="{{ url_for('cluster_add') }}">Add cluster</a>
      <a href="{{ url_for('config_page') }}">Settings</a>
      <form class="inline" method="post" action="{{ url_for('logout') }}">
        <button type="submit" class="topnav-button">Log out</button>
      </form>
    </div>
    {% endif %}
  </nav>

  {% block header %}{% endblock %}

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</body>
</html>
